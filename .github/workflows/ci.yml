name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Microfiche.xcodeproj
  SCHEME: Microfiche
  CONFIGURATION: Debug
  # Ad-hoc signing so the run does not depend on a provisioned certificate.
  SIGNING: >-
    CODE_SIGN_STYLE=Manual
    CODE_SIGN_IDENTITY=-
    CODE_SIGNING_REQUIRED=NO
    DEVELOPMENT_TEAM=

# Xcode 26 (macOS 26 SDK) is required: the app uses Liquid Glass APIs
# (.glassEffect, .buttonStyle(.glass), sharedBackgroundVisibility) and
# macOS 26-gated resource writes. macos-26 ships Xcode 26.x by default.
jobs:
  build:
    name: Build (macOS)
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

  unit-tests:
    name: Unit tests (MicroficheTests)
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -only-testing:MicroficheTests \
            -resultBundlePath build/UnitTestResults.xcresult \
            $SIGNING \
            test

      - name: Upload unit test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: build/UnitTestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

  ui-tests-core:
    name: UI tests (PCD-26 core)
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run PCD-26 core UI tests
        run: |
          set -o pipefail
          tests=(
            MicroficheUITests/MicroficheUITests/testAppLaunchesTwice
            MicroficheUITests/MicroficheUITests/testFixtureLibraryAndRepeatedSelectionTransitions
            MicroficheUITests/MicroficheUITests/testSelectedAndUnselectedDoubleClicksOpenTheCorrectImageTwice
            MicroficheUITests/MicroficheUITests/testDragAndContextMenuDoNotDisableLaterClicksTwiceInBothViews
            MicroficheUITests/MicroficheUITests/testRemovingSelectedImageClearsInspectorWithoutStaleContent
            MicroficheUITests/MicroficheUITests/testSidebarCollapseAndExpansionPersistAcrossRelaunchTwice
            MicroficheUITests/MicroficheUITests/testInspectorCollapseAndExpansionPersistAcrossRelaunchTwice
            MicroficheUITests/MicroficheUITests/testViewModeSwitchingPreservesSelectionAndKeyboardFocusRepeatedly
            MicroficheUITests/MicroficheUITests/testInspectorTextEditingKeepsKeyboardInputOutOfLibraryNavigation
            MicroficheUITests/MicroficheUITests/testFloatingViewControlNeverCoversLastItemRepeatedly
          )
          args=()
          for test in "${tests[@]}"; do
            args+=( "-only-testing:$test" )
          done
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 240 \
            -resultBundlePath build/CoreUITestResults.xcresult \
            "${args[@]}" \
            $SIGNING \
            test

      - name: Upload core UI test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: core-ui-test-results
          path: build/CoreUITestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

  ui-tests:
    name: UI tests (full suite, advisory)
    runs-on: macos-26
    needs: [ui-tests-core]
    # The full suite includes slower or environment-sensitive cases. Core PCD-26
    # coverage is enforced by ui-tests-core; inspect this job for extra signal.
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -only-testing:MicroficheUITests \
            -resultBundlePath build/UITestResults.xcresult \
            $SIGNING \
            test

      - name: Upload UI test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: build/UITestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7